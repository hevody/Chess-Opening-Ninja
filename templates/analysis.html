<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Ninja</title>
  <style>
    body {
      font-family: Helvetica, sans-serif;
      background-color: #2E2910;
      color: #EBE3A7;
    }

    .glow-both,
    .black-button,
    .white-button {
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 10px 25px;
      border-radius: 8px;
      font-weight: bold;
      width: 95px;
    }
    
    h1 {
      color: #EBE3A7;
    }

    .white-button {
      background-color: white; 
      color: black;
    }

    .black-button {
      background-color: black;
      color: white;
    }

    .glow-both {
    border: none;
    outline: none;
    color: #fff;
    cursor: pointer;
    position: relative;
    z-index: 0;
    background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
    animation: glowing 20s linear infinite;
    background-size: 400%;
  }
  /* credits: https://dev.to/webdeasy/top-20-css-buttons-animations-f41?utm_source=additional_box&utm_medium=internal&utm_campaign=regular&booster_org */
  @keyframes glowing {
    0% { background-position: 0 0; }
    50% { background-position: 400% 0; }
    100% { background-position: 0 0; }
  }
  input {
    height: 20px;
  }
  </style>
</head>
<body>
  <h1><img src="https://cdn-icons-png.flaticon.com/512/1163/1163115.png" width="auto" height="50" alt="">Opening Ninja</h1>
  <br>
  <div id="status-container">
    <h3 id="status">Fetching data. Please wait... <img width="25px" height="auto" src="https://media.tenor.com/WX_LDjYUrMsAAAAi/loading.gif" alt="loading"></h3>
  </div>
  <script>
    fetch('/perform-calc-and-analysis')
      .then(response => response.json())
      .then(data => {
          let htmlShowResultPage = `<h3>Analysis Complete</h3><br>`;
          for (const side in data.ar) {
            if (side === 'White') {
              htmlShowResultPage += `<br><br><h2><img src="https://cdn-icons-png.flaticon.com/512/5093/5093004.png " alt="chesskingwhite" height="50" width="auto">White Openings:</h2>`;
              for (const [opening, times] of data.ar.White) {
                htmlShowResultPage += `<details><summary>${opening}</summary><p>played ${times} time(s)!</p></details>`
                }
            }
            else if (side == 'Black') {
              htmlShowResultPage += `<br><br><h2><img src="https://cdn-icons-png.flaticon.com/512/4789/4789555.png " alt="chesskingblack" height="50" width="auto">Black Openings:</h2>`;
              for (const [opening, times] of data.ar.Black) {
                htmlShowResultPage += `<details><summary>${opening}</summary><p>played ${times} time(s)!</p></details>`
              }
            }
        document.getElementById('status-container').innerHTML = htmlShowResultPage;
      }})
      .catch(error => {
          document.getElementById('status').innerText = "An error occurred during calculation.";
          console.error('Error:', error);
      });
  </script>
</body>
</html>
